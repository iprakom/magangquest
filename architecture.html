<!DOCTYPE html>

    <style>
        * {

            padding: 0;

        body {

            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

            color: #58a6ff;

        }
        .subtitle {
            text-align: center;
            color: #8b949e;

        }
        .diagram-container {
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 20px 0;
        }
        svg {
            display: block;
        }
        .legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            background: #161b22;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

</head>
